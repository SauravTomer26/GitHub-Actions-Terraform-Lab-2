name: Azure OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  
jobs:
  JOB_1-azure-login-test:
    runs-on: self-hosted

    steps:
      - name: STEP-1 - Checkout Repository
        uses: actions/checkout@v4

      - name: STEP-2 - Logint to Azure
        uses: actions/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
      - name: STEP-3 - Verify Login Account
        run: az account show
